<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AREDN Neighborhood Browser</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>AREDN Neighborhood Browser</h1>
        <p>Explore mesh neighbors starting from a seed node.</p>
      </div>
      <form id="seed-form" class="seed-form" autocomplete="off">
        <div class="seed-input-wrapper">
          <label for="seed-input">Start Node</label>
          <div class="seed-input-field">
            <input
              type="text"
              id="seed-input"
              name="seed"
              placeholder="localnode.local.mesh"
              value="localnode.local.mesh"
              required
              autocomplete="off"
            />
            <ul id="seed-suggestions" class="seed-suggestions"></ul>
          </div>
        </div>
        <button type="submit">Reload Graph</button>
      </form>
    </header>

    <main>
      <section class="graph-panel">
        <div class="graph-status" id="graph-status"></div>
        <svg id="graph-canvas" role="img" aria-label="AREDN graph"></svg>
      </section>

      <aside class="info-panel" id="info-panel">
        <h2>Node Details</h2>
        <p>Select a node to view metadata.</p>
        <dl id="info-panel-body"></dl>
        <button id="clear-graph" class="ghost">Reset</button>
      </aside>
    </main>

    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
