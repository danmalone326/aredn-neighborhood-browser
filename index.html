<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AREDN Neighborhood Browser</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>AREDN Neighborhood Browser</h1>
        <p>by Dan Malone - AK6DM  (<a href="https://github.com/danmalone326/aredn-neighborhood-browser" target="_blank" rel="noopener noreferrer">source available on github</a>)</p>
      </div>
      <form id="seed-form" class="seed-form" autocomplete="off">
        <div class="seed-input-wrapper">
          <label for="seed-input">Node</label>
          <div class="seed-input-field">
            <input
              type="text"
              id="seed-input"
              name="seed"
              placeholder="localnode.local.mesh"
              value="localnode.local.mesh"
              required
              autocomplete="off"
            />
            <ul id="seed-suggestions" class="seed-suggestions"></ul>
          </div>
        </div>
        <div class="seed-actions">
          <button type="button" id="add-node-btn">Add</button>
          <button type="button" id="reset-graph" class="ghost">Reset</button>
        </div>
      </form>
    </header>


    <main>
      <section class="graph-panel">
        <div class="graph-status" id="graph-status"></div>
        <svg id="graph-canvas" role="img" aria-label="AREDN graph"></svg>
      </section>

      <aside class="info-panel" id="info-panel">
        <h2>Node Details</h2>
        <p>Select a node to view metadata.</p>
        <dl id="info-panel-body"></dl>
      </aside>
    </main>

    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
